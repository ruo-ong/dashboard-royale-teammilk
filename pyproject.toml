[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "royale"
version = "0.1.0"
description = "Team Milk shared helpers for the Dashboard Royale challenge"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["royale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
